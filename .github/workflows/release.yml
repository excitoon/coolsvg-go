name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
            echo "release tag must be SemVer with a v prefix" >&2
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Scan reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Test with race detector
        run: go test -mod=readonly -race ./...

      - name: Test SIMD build
        env:
          GOEXPERIMENT: simd
        run: go test -mod=readonly ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          archive="coolsvg-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          stage="build/${archive}"
          mkdir -p "$stage" release
          executable="coolsvg"
          if [ "$GOOS" = windows ]; then
            executable="coolsvg.exe"
          fi
          if [ "$GOARCH" = amd64 ]; then
            export GOEXPERIMENT=simd
          fi
          go build -mod=readonly -trimpath -ldflags="-s -w" -o "$stage/$executable" ./cmd/coolsvg
          cp LICENSE.md README.md THIRD_PARTY_LICENSES.md "$stage/"
          if [ "$GOOS" = windows ]; then
            (cd build && zip -r "../release/${archive}.zip" "$archive")
          else
            tar -C build -czf "release/${archive}.tar.gz" "$archive"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coolsvg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: coolsvg-*
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          RELEASE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          tag_without_metadata="${GITHUB_REF_NAME%%+*}"
          if [[ "$tag_without_metadata" == *-* ]]; then
            prerelease=true
          fi
          encoded_tag="$(jq -rn --arg value "$GITHUB_REF_NAME" '$value | @uri')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${RELEASE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}")"
          case "$status" in
            200)
              response="$(<"$response_file")"
              ;;
            404)
              payload="$(jq -n \
                --arg tag "$GITHUB_REF_NAME" \
                --argjson prerelease "$prerelease" \
                '{tag_name: $tag, name: $tag, generate_release_notes: true, prerelease: $prerelease, draft: true}')"
              response="$(curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${RELEASE_TOKEN}" \
                --header "Content-Type: application/json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
                --data "$payload")"
              ;;
            *)
              cat "$response_file" >&2
              exit 1
              ;;
          esac
          release_id="$(jq -er '.id | tostring' <<<"$response")"
          upload_url="$(jq -er '.upload_url | sub("\\{.*$"; "")' <<<"$response")"
          for asset in release/*; do
            name="${asset##*/}"
            if jq -e --arg name "$name" '.assets[]? | select(.name == $name)' <<<"$response" >/dev/null; then
              continue
            fi
            encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${RELEASE_TOKEN}" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${upload_url}?name=${encoded_name}" \
              --data-binary "@${asset}" >/dev/null
          done
          publish_payload="$(jq -n \
            --arg name "$GITHUB_REF_NAME" \
            --argjson prerelease "$prerelease" \
            '{name: $name, prerelease: $prerelease, draft: false}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${RELEASE_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --data "$publish_payload" >/dev/null
