name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|1)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
            echo "release tag must be SemVer v0.x.y or v1.x.y" >&2
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Test with race detector
        run: go test -mod=readonly -race ./...

      - name: Test SIMD build
        env:
          GOEXPERIMENT: simd
        run: go test -mod=readonly ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          archive="coolsvg-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          stage="build/${archive}"
          mkdir -p "$stage" release
          executable="coolsvg"
          if [ "$GOOS" = windows ]; then
            executable="coolsvg.exe"
          fi
          if [ "$GOARCH" = amd64 ]; then
            export GOEXPERIMENT=simd
          fi
          go build -mod=readonly -trimpath -ldflags="-s -w" -o "$stage/$executable" ./cmd/coolsvg
          cp LICENSE.md README.md "$stage/"
          if [ "$GOOS" = windows ]; then
            (cd build && zip -r "../release/${archive}.zip" "$archive")
          else
            tar -C build -czf "release/${archive}.tar.gz" "$archive"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coolsvg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: coolsvg-*
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          RELEASE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=false
          tag_without_metadata="${GITHUB_REF_NAME%%+*}"
          if [[ "$tag_without_metadata" == *-* ]]; then
            prerelease=true
          fi
          payload="$(jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson prerelease "$prerelease" \
            '{tag_name: $tag, name: $tag, generate_release_notes: true, prerelease: $prerelease}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${RELEASE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            --data "$payload")"
          upload_url="$(jq -r '.upload_url | sub("\\{.*$"; "")' <<<"$response")"
          test -n "$upload_url"
          for asset in release/*; do
            name="${asset##*/}"
            encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${RELEASE_TOKEN}" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${upload_url}?name=${encoded_name}" \
              --data-binary "@${asset}" >/dev/null
          done
